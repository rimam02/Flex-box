<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlexDash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <header class="top-header">
        <div class="brand">FlexDash</div>

        <input type="text" class="search" placeholder="Search dashboard...">

        <div class="profile"> Admin</div>
    </header>

   
    <div class="layout">

       
        <aside class="sidebar">
            <a href="#">Dashboard</a>
            <a href="#">Analytics</a>
            <a href="#">Users</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

    
        <main class="content">

       
            <div class="stats">
                <div class="card">
                    <h4>Users</h4>
                    <p>1,240</p>
                </div>

                <div class="card">
                    <h4>Revenue</h4>
                    <p>₹2.4L</p>
                </div>

                <div class="card">
                    <h4>Orders</h4>
                    <p>320</p>
                </div>
            </div>

          
            <div class="highlights">
                <div class="highlight">
                    Growth <br><strong>+18%</strong>
                </div>

                <div class="highlight">
                    Conversion <br><strong>5.4%</strong>
                </div>
            </div>

        </main>
    </div>
<footer> Flex Dash </footer>
</body>
</html>
